name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Runner user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: travel-request-service/app:dev
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup
        run: make setup

      - name: Services
        run: make urls

      - name: QA
        run: make qa

      - name: Load test data
        run: make load-seed

      - name: Load smoke
        run: make load-smoke RUN=ci

      - name: Concurrency guarantee
        run: make load-concurrency RUN=ci

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
