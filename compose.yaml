name: travel-request-service

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-otel-environment: &otel-environment
  OTEL_PHP_AUTOLOAD_ENABLED: ${OTEL_PHP_AUTOLOAD_ENABLED:-true}
  OTEL_PHP_DISABLED_INSTRUMENTATIONS: ${OTEL_PHP_DISABLED_INSTRUMENTATIONS:-laravel}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=local}
  OTEL_PHP_DETECTORS: ${OTEL_PHP_DETECTORS:-host,process,service_instance}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-2000}
  OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-5000}

services:
  app:
    cpuset: "${APP_CPUSET:-}"
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: travel-request-service/app:dev
    command:
      - php
      - artisan
      - octane:start
      - --server=swoole
      - --host=0.0.0.0
      - --port=8000
      - --workers=${OCTANE_WORKERS:-24}
      - --max-requests=${OCTANE_MAX_REQUESTS:-500}
    environment:
      <<: *otel-environment
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-travel_request_testing}
      DB_READ_HOST: ${APP_DB_READ_HOST:-mysql-replica}
      OTEL_SERVICE_NAME: travel-request-service
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql: { condition: service_healthy }
      mysql-replica: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/live"]

  outbox-relay:
    cpuset: "${BACKING_CPUSET:-}"
    image: travel-request-service/app:dev
    command: ["php", "artisan", "outbox:relay"]
    restart: unless-stopped
    environment:
      <<: *otel-environment
      DB_READ_HOST: mysql
      OTEL_SERVICE_NAME: travel-request-outbox-relay
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pgrep", "-f", "outbox:relay"]

  notification-consumer:
    cpuset: "${BACKING_CPUSET:-}"
    image: travel-request-service/app:dev
    command: ["php", "artisan", "notification:consume"]
    restart: unless-stopped
    deploy:
      replicas: ${NOTIFICATION_CONSUMERS:-2}
    environment:
      <<: *otel-environment
      DB_READ_HOST: mysql
      OTEL_SERVICE_NAME: travel-request-notification
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      reverb: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pgrep", "-f", "notification:consume"]

  reverb:
    cpuset: "${BACKING_CPUSET:-}"
    image: travel-request-service/app:dev
    command: ["php", "artisan", "reverb:start", "--debug"]
    restart: unless-stopped
    environment:
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${FORWARD_REVERB_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]

  mysql:
    cpuset: "${BACKING_CPUSET:-}"
    image: mysql:8.4
    command:
      - --sync-binlog=${DB_SYNC_BINLOG:-1}
      - --innodb-flush-log-at-trx-commit=${DB_FLUSH_LOG_AT_TRX_COMMIT:-1}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-travel_request}
      MYSQL_USER: ${DB_USERNAME:-travel_request}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-travel_request_testing}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf/primary.cnf:/etc/mysql/conf.d/zz-primary.cnf:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  mysql-replica:
    cpuset: "${BACKING_CPUSET:-}"
    image: mysql:8.4
    command:
      - --replicate-do-db=${DB_DATABASE:-travel_request}
    ports:
      - "${FORWARD_DB_REPLICA_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./docker/mysql/conf/replica.cnf:/etc/mysql/conf.d/zz-replica.cnf:ro
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  redis:
    cpuset: "${BACKING_CPUSET:-}"
    image: redis:8.10-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    cpuset: "${BACKING_CPUSET:-}"
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    ports:
      - "${FORWARD_RABBITMQ_PORT:-5672}:5672"
      - "${FORWARD_RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-travel_request}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck
      start_period: 20s
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]

  mailpit:
    cpuset: "${BACKING_CPUSET:-}"
    image: axllent/mailpit:v1.33
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  otel-collector:
    cpuset: "${BACKING_CPUSET:-}"
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [obs]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger: { condition: service_started }
      loki: { condition: service_started }

  jaeger:
    cpuset: "${BACKING_CPUSET:-}"
    image: jaegertracing/jaeger:2.23.0
    profiles: [obs]
    ports:
      - "${FORWARD_JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    cpuset: "${BACKING_CPUSET:-}"
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
    ports:
      - "${FORWARD_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    cpuset: "${BACKING_CPUSET:-}"
    image: grafana/loki:3.6.20
    profiles: [obs]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${FORWARD_LOKI_PORT:-3100}:3100"

  grafana:
    cpuset: "${BACKING_CPUSET:-}"
    image: grafana/grafana:13.2.6
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/travel-request-service.json
    ports:
      - "${FORWARD_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
      jaeger: { condition: service_started }

  cadvisor:
    cpuset: "${BACKING_CPUSET:-}"
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [obs]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --enable_metrics=cpu,memory
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  app-debian:
    cpuset: "${APP_CPUSET:-}"
    build:
      context: .
      dockerfile: docker/debian/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: travel-request-service/app:debian
    profiles: [debian]
    command:
      - php
      - artisan
      - octane:start
      - --server=swoole
      - --host=0.0.0.0
      - --port=8000
      - --workers=${OCTANE_WORKERS:-24}
      - --max-requests=${OCTANE_MAX_REQUESTS:-500}
    environment:
      <<: *otel-environment
      DB_READ_HOST: ${APP_DB_READ_HOST:-mysql-replica}
      OTEL_SERVICE_NAME: travel-request-service-debian
    volumes:
      - .:/var/www/html
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/live"]

  k6:
    cpuset: "${K6_CPUSET:-}"
    image: grafana/k6:2.2.0
    profiles: [load]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      BASE_URL: ${LOAD_BASE_URL:-http://app:8000}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max,avg
    volumes:
      - ./tests/Load:/scripts:ro
      - ./build/load:/results

  likec4:
    image: likec4/likec4:1.60.0
    profiles: [docs]
    init: true
    command: ["start"]
    ports:
      - "${FORWARD_LIKEC4_PORT:-5173}:5173"
      - "${FORWARD_LIKEC4_HMR_PORT:-24678}:24678"
    volumes:
      - ./docs/architecture:/data

volumes:
  mysql-data:
  mysql-replica-data:
  redis-data:
  rabbitmq-data:
