name: travel-request-service

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

x-otel-environment: &otel-environment
  OTEL_PHP_AUTOLOAD_ENABLED: ${OTEL_PHP_AUTOLOAD_ENABLED:-true}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=local}
  OTEL_PHP_DETECTORS: ${OTEL_PHP_DETECTORS:-host,process,service_instance}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-2000}
  OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}

services:
  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: travel-request-service/app:dev
    environment:
      <<: *otel-environment
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-travel_request_testing}
      OTEL_SERVICE_NAME: travel-request-service
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/live"]

  outbox-relay:
    image: travel-request-service/app:dev
    command: ["php", "artisan", "outbox:relay"]
    restart: unless-stopped
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: travel-request-outbox-relay
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pgrep", "-f", "outbox:relay"]

  notification-consumer:
    image: travel-request-service/app:dev
    command: ["php", "artisan", "notification:consume"]
    restart: unless-stopped
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: travel-request-notification
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      reverb: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pgrep", "-f", "notification:consume"]

  reverb:
    image: travel-request-service/app:dev
    command: ["php", "artisan", "reverb:start", "--debug"]
    restart: unless-stopped
    environment:
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${FORWARD_REVERB_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-travel_request}
      MYSQL_USER: ${DB_USERNAME:-travel_request}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:-travel_request_testing}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  redis:
    image: redis:8.10-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    ports:
      - "${FORWARD_RABBITMQ_PORT:-5672}:5672"
      - "${FORWARD_RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-travel_request}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck
      start_period: 20s
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [obs]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger: { condition: service_started }
      loki: { condition: service_started }

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [obs]
    ports:
      - "${FORWARD_JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "${FORWARD_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.6.20
    profiles: [obs]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${FORWARD_LOKI_PORT:-3100}:3100"

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/travel-request-service.json
    ports:
      - "${FORWARD_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
      jaeger: { condition: service_started }

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
