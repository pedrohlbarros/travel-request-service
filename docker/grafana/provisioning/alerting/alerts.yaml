apiVersion: 1

groups:
  - orgId: 1
    name: notification
    folder: Travel Request Service
    interval: 30s
    rules:
      - uid: notification-dlq-not-empty
        title: Decisões na dead letter queue
        condition: above_zero
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Há decisões que não puderam ser notificadas (make dlq para ver o motivo).
        data:
          - refId: dlq
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rabbitmq_detailed_queue_messages{queue="notification.travel_request.dlq"}) or vector(0)
              instant: true
              refId: dlq
          - refId: above_zero
            datasourceUid: __expr__
            model:
              type: threshold
              expression: dlq
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: above_zero
