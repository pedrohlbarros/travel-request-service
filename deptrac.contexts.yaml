deptrac:
  paths:
    - ./src
  layers:
    - name: TravelRequest
      collectors: [{ type: classNameRegex, value: '#^(Domain|Application|Infrastructure|Interfaces\\Http|Interfaces\\Console)\\TravelRequest\\#' }]
    - name: Identity
      collectors: [{ type: classNameRegex, value: '#^(Domain|Application|Infrastructure|Interfaces\\Http|Interfaces\\Console)\\Identity\\#' }]
    - name: Notification
      collectors: [{ type: classNameRegex, value: '#^(Domain|Application|Infrastructure|Interfaces\\Http|Interfaces\\Console)\\Notification\\#' }]
    - name: Shared
      collectors: [{ type: classNameRegex, value: '#^(Domain|Application|Infrastructure|Interfaces\\Http|Interfaces\\Console)\\Shared\\#' }]
  ruleset:
    TravelRequest: [Shared]
    Identity: [Shared]
    Notification: [Shared]
    Shared: ~
